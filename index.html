<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050408">
  <title>iYokai ミ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap">
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <main id="term" class="term">
    <div class="term__win">
      <p class="term__log">iYokai OS<br>Sessione notturna aperta. Il regno attende il comando.</p>
      <form id="cmd" class="prompt" autocomplete="off">
        <span class="prompt__ps" aria-hidden="true">›</span>
        <input id="in" value="/iYokai ミ" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Comando">
        <button id="go" type="submit">
          <svg viewBox="0 0 64 64" width="18" height="18" aria-hidden="true"><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M22 18l22-6"/><path d="M18 34l28-7"/><path d="M13 51l38-10"/></g></svg>
          Enter the Realm
        </button>
      </form>
      <p id="err" class="term__err" role="status"></p>
      <p class="term__log">Press Enter to enter the realm</p>
      <div id="cd" class="term__cd"><span id="cdt"></span><i><b id="cdf"></b></i></div>
    </div>
  </main>
  <div id="hub" class="hub" hidden>
    <header class="hub__top"><h1 class="hub__word">iYokai</h1><p class="hub__tag">Un solo cuore. Infinite possibilità.</p></header>
    <nav class="hub__mods" aria-label="Moduli"></nav>
    <aside id="player" class="player" aria-label="Player musicale">
      <div class="player__meta"><span class="player__cover" aria-hidden="true">ミ</span><div><b id="pt">Tracce in arrivo</b><small id="pa">iYokaiミ</small></div></div>
      <div class="player__bar"><i id="pp"></i></div>
      <div class="player__ctl"><button id="pprev" aria-label="Precedente"></button><button id="ppl" class="player__play" aria-label="Riproduci"></button><button id="pnext" aria-label="Successiva"></button></div>
    </aside>
    <span class="hub__v hub__v--l" aria-hidden="true">管理・創造・成長</span>
    <span class="hub__v hub__v--r" aria-hidden="true">妖怪</span>
  </div>
  <noscript>iYokai ミ richiede JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
